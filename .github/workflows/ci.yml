name: CI

on:
  push:
    branches:
      - develop
      - 'feature/**'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore Homies.sln

      - name: Build solution
        run: dotnet build Homies.sln --configuration Release --no-restore

      - name: Run all unit and integration tests
        run: dotnet test Homies.sln --configuration Release --no-build --no-restore --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
